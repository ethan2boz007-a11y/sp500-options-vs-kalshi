name: collect-snapshots

on:
  schedule:
    - cron: "2,17,32,47 13-20 * * 1-5"
    - cron: "7,12,22,27,37,42,52,57 19-20 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: snapshots
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python collect_snapshot.py

      - name: Save new data to the repo
        run: |
          git config user.name "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
