# Free price check for Databento option data (see databento_cost_check.py).
# Needs the repository secret DATABENTO_API_KEY. Downloads nothing, costs nothing.

name: databento-cost-check

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt databento

      - name: Ask Databento for prices
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
        run: python databento_cost_check.py

      - name: Save to the repo
        if: always()
        run: |
          git config user.name "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add databento || true
          git diff --cached --quiet || git commit -m "Databento cost check"
          git pull --rebase
          git push
